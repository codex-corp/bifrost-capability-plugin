name: Release

on:
  push:
    tags:
      - bifrost-v2.0.0-r*

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Check out exact Bifrost source
        run: |
          git clone --filter=blob:none https://github.com/maximhq/bifrost.git /tmp/bifrost-v2.0.0
          git -C /tmp/bifrost-v2.0.0 checkout e4a30d6041c0446603aea615bc5da340dac001b1
      - name: Build and test ABI-matched release
        run: |
          set -euo pipefail
          scripts/build_matched.sh
          python3 scripts/test_candidate.py
          RELEASE_TAG="$GITHUB_REF_NAME" scripts/package_release.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(.build/release/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Bifrost Capability Router for Bifrost v2.0.0" \
              --generate-notes
          fi
      - name: Verify published downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)
          asset="agent-capability-router-bifrost-v2.0.0-linux-amd64-glibc.so"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset}" -o "$verify_dir/http-download.so"
          cmp "$verify_dir/$asset" "$verify_dir/http-download.so"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Publish matched runtime image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:bifrost-v2.0.0
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            RELEASE_TAG=${{ github.ref_name }}
            BIFROST_VERSION=v2.0.0
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test -x /usr/local/bin/bifrost-http
            test -f /opt/bifrost/plugins/agent-capability-router.so
            test -f /opt/bifrost/compatible-runtime.json
            test -f /opt/bifrost/isolated-test-result.json
          '
