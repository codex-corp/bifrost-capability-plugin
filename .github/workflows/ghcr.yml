name: Publish GHCR Runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to package
        required: true
        default: bifrost-v2.0.0-r1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download and verify tested release bundle
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^bifrost-v2\.0\.0-r[1-9][0-9]*$ ]] || {
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          }

          # Resolve the commit behind the release tag, including annotated tags,
          # so OCI provenance identifies the source release rather than the
          # workflow commit that happened to package it.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

          release_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern "agent-capability-router-bifrost-v2.0.0-linux-amd64-glibc.so" \
            --pattern "bifrost-http-bifrost-v2.0.0-linux-amd64-glibc" \
            --pattern "bifrost-capability-plugin-${RELEASE_TAG}-linux-amd64-glibc.tar.gz" \
            --pattern SHA256SUMS
          (cd "$release_dir" && sha256sum -c SHA256SUMS)

          tar -xzf "$release_dir/bifrost-capability-plugin-${RELEASE_TAG}-linux-amd64-glibc.tar.gz" -C "$release_dir"
          bundle_dir="$release_dir/bifrost-capability-plugin-${RELEASE_TAG}-linux-amd64-glibc"
          test -f "$bundle_dir/.build/matched/bifrost-http"
          test -f "$bundle_dir/.build/matched/agent-capability-router.so"
          test -f "$bundle_dir/.build/matched/compatible-runtime.json"
          test -f "$bundle_dir/.build/matched/isolated-test-result.json"
          mkdir -p .build
          cp -a "$bundle_dir/.build/matched" .build/matched
          (cd .build/matched && sha256sum -c SHA256SUMS)

          latest_tag="$(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
              grep -E '^bifrost-v2\.0\.0-r[1-9][0-9]*$' |
              sort -V |
              tail -n 1
          )"
          test -n "$latest_tag"

          {
            echo 'tags<<EOF'
            echo "$IMAGE_NAME:$RELEASE_TAG"
            if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
              echo "$IMAGE_NAME:bifrost-v2.0.0"
              echo "$IMAGE_NAME:latest"
            else
              echo "Keeping mutable aliases on newer release $latest_tag" >&2
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build and push release runtime image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            RELEASE_TAG=${{ env.RELEASE_TAG }}
            BIFROST_VERSION=v2.0.0
            VCS_REF=${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}

      - name: Verify published image
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME:$RELEASE_TAG"
          test "$(docker image inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
          docker run --rm --entrypoint /bin/sh "$IMAGE_NAME:$RELEASE_TAG" -ec '
            test -x /usr/local/bin/bifrost-http
            test -f /opt/bifrost/plugins/agent-capability-router.so
            test -f /opt/bifrost/compatible-runtime.json
            test -f /opt/bifrost/isolated-test-result.json
          '
