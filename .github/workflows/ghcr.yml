name: Publish GHCR Runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to package
        required: true
        default: bifrost-v2.0.0-r1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download tested release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern "bifrost-capability-plugin-${RELEASE_TAG}-linux-amd64-glibc.tar.gz" \
            --pattern SHA256SUMS
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          tar -xzf "$release_dir/bifrost-capability-plugin-${RELEASE_TAG}-linux-amd64-glibc.tar.gz" -C "$release_dir"
          bundle_dir="$release_dir/bifrost-capability-plugin-${RELEASE_TAG}-linux-amd64-glibc"
          test -f "$bundle_dir/.build/matched/bifrost-http"
          test -f "$bundle_dir/.build/matched/agent-capability-router.so"
          test -f "$bundle_dir/.build/matched/compatible-runtime.json"
          test -f "$bundle_dir/.build/matched/isolated-test-result.json"
          mkdir -p .build
          cp -a "$bundle_dir/.build/matched" .build/matched
          (cd .build/matched && sha256sum -c SHA256SUMS)

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build and push immutable runtime image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:bifrost-v2.0.0
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            RELEASE_TAG=${{ env.RELEASE_TAG }}
            BIFROST_VERSION=v2.0.0
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME:$RELEASE_TAG"
          test "$(docker image inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{.Architecture}}')" = amd64
          docker run --rm --entrypoint /bin/sh "$IMAGE_NAME:$RELEASE_TAG" -ec '
            test -x /usr/local/bin/bifrost-http
            test -f /opt/bifrost/plugins/agent-capability-router.so
            test -f /opt/bifrost/compatible-runtime.json
            test -f /opt/bifrost/isolated-test-result.json
          '
